- name: Create directories for Docker volumes
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/gitlab/config
    - /etc/gitlab/data
    - /etc/gitlab/logs
    - /etc/nginx
    - /etc/nginx/letsencrypt
    - /etc/nginx/html
    - /srv
  become: true

- name: Create docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /srv/docker-compose.yml
    mode: "0644"
  become: true

- name: Create Docker env file
  template:
    src: env.j2
    dest: /srv/.env
    mode: "0600"
  become: true

- name: Create Nginx config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  become: true
  notify: Restart Nginx

- name: Start Docker containers
  community.docker.docker_compose:
    project_src: /srv
    files:
      - docker-compose.yml
    state: present
  become: true

- name: Obtain SSL certificate from Let's Encrypt
  command: >
    docker run --rm 
    -v /etc/nginx/letsencrypt:/etc/letsencrypt 
    -v /etc/nginx/html:/var/www/html 
    {{ certbot_image }} certonly --webroot 
    --webroot-path=/var/www/html 
    --email {{ certbot_email }} 
    --agree-tos 
    --no-eff-email 
    -d {{ gitlab_host }} -d {{ registry_host }}
  become: true
  args:
    creates: /etc/nginx/letsencrypt/live/{{ gitlab_host }}/fullchain.pem
  notify: Restart Nginx
